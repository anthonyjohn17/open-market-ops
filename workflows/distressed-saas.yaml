# STUB — validate only until connectors ship (v0.3+)
# Concept: Distressed SaaS Finder — see concept.md Example 1

name: distressed_saas_finder
version: "0.0.1"
description: Find under-maintained SaaS acquisition opportunities (not runnable in v0.1)
wedge: distressed-saas

feed:
  connectors:
    - id: acquire_com
      config: { enabled: false }
    - id: indie_hackers
      config: { enabled: false }

detect:
  rules:
    - founder_burnout_language
    - review_decline
    - stale_release

asset:
  type: saas_product
  extract:
    - product_name
    - mrr_estimate
    - active_users

trigger:
  window_days: 90
  boost_if:
    - price_reduction
    - founder_burnout

buyer:
  segments:
    - micro_pe
    - saas_founders
    - search_funds
  match: buyer-matching/v1

monetize:
  recommended:
    - broker
    - retainer
    - relaunch
  scoring: monetization-engine/v1

scoring:
  min_opportunity_score: 55
  weights:
    urgency: 0.2
    buyer_density: 0.25
    monetization_potential: 0.3
    competition: 0.15
    liquidity_speed: 0.1

output:
  formats:
    - opportunity_cards
  min_score: 65
