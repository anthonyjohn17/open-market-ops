name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - run: pnpm validate:workflows
      - name: Validate MVP workflow
        run: MOCK_FEEDS=true pnpm omo validate workflows/hiring-signals.yaml
      - name: E2E mock run
        run: MOCK_FEEDS=true pnpm omo run workflows/hiring-signals.yaml --output /tmp/omo-out --min-score 50
